<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Admin Panel</title>

  <link
    rel="stylesheet"
    href="css/admin.css"
  />

</head>

<body>

  <header class="topbar">

    <div class="logo">
      Admin Panel
    </div>

    <nav class="menu">

      <a
        href="index.html"
        class="menu-btn"
      >
        Back to Worker UI
      </a>

    </nav>

  </header>

  <main class="admin-layout">

    
    <!-- PROJECTS -->

<section class="admin-card">

  <h2>Projects</h2>

  <div class="add-row">

    <input
      type="text"
      id="projectName"
      placeholder="034.1580"
    />

    <button onclick="addProject()">
      Add Project
    </button>

  </div>

  <label class="current-project-label">
    Current Project
  </label>

  <select id="projectSelect">

  </select>

  <button onclick="setCurrentProject()">
    Set Current
  </button>

</section>
    
    
    <!-- IMPORT -->

    <section class="admin-card">

      <h2>Import TXT</h2>

      <input
        type="file"
        id="txtFile"
        accept=".txt"
      />

      <button onclick="importTxt()">
        Import TXT
      </button>

    </section>

    <!-- MANUAL -->

    <section class="admin-card">

      <h2>Add Facade</h2>

      <div class="add-row">

        <input
          type="text"
          id="newFacade"
          placeholder="KF1"
        />

        <button onclick="addFacade()">
          Add
        </button>

      </div>

    </section>

    <!-- LIST -->

    <section class="admin-card">

  <h2>Employees</h2>

  <div class="add-row">

    <input
      type="text"
      id="employeeName"
      placeholder="Dmitry"
    />

    <button onclick="addEmployee()">
      Add Employee
    </button>

  </div>

  <div
    class="facade-list"
    id="employeeList"
  ></div>

</section>

    <section class="admin-card">

      <h2>Facade List</h2>

      <div
        class="facade-list"
        id="facadeList"
      >

      </div>

    </section>

  </main>

  <script
    type="module"
    src="js/admin.js"
  ></script>

</body>

</html>
