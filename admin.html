<link rel="stylesheet" href="css/style.css">
<main class="admin-layout">
  <div class="admin-grid">
    <section class="input-panel">
      <h2>Projects</h2>
      <input type="text" placeholder="Project Name" id="projectName" />
      <select id="projectList"></select>
      <button onclick="setCurrentProject()">Set Current</button>
      <button onclick="addProject()">Add Project</button>
    </section>

    <section class="input-panel">
      <h2>Import TXT</h2>
      <input type="file" id="txtFile" />
      <button onclick="importTXT()">Import TXT</button>
    </section>

    <section class="input-panel">
      <h2>Add Facade</h2>
      <input type="text" placeholder="Facade Name" id="facadeName" />
      <button onclick="addFacade()">Add Facade</button>
    </section>

    <section class="input-panel">
      <h2>Facade List</h2>
      <ul id="facadeList"></ul>
    </section>

    <section class="input-panel">
      <h2>Elements</h2>
      <input type="text" placeholder="Element Name" id="newElement" />
      <input type="file" id="elementFile" />
      <button onclick="addElement()">Add Element</button>
      <button onclick="importElementsTXT()">Import Elements TXT</button>
    </section>

    <section class="input-panel">
      <h2>Elements List</h2>
      <ul id="elementsList"></ul>
    </section>

    <section class="input-panel">
      <h2>Employees</h2>
      <input type="text" placeholder="Employee Name" id="employeeName" />
      <button onclick="addEmployee()">Add Employee</button>
      <ul id="employeesList"></ul>
    </section>
  </div>
</main>
