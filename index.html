<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Facade Control System</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link
    rel="stylesheet"
    href="css/style.css"
  />

</head>

<body>

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="logo">
      Facade Control System
    </div>

    <nav class="menu">

      <button class="menu-btn active">
        Assembly
      </button>

      <button
        id="viewPdfBtn"
        class="menu-btn"
      >
        Viewer
      </button>

      <a
        href="admin.html"
        class="menu-btn"
      >
        Admin
      </a>

    </nav>

    <div class="user-role">
      Worker
    </div>

  </header>

  <!-- MAIN -->

  <main class="layout">

    <!-- LEFT PANEL -->

    <section class="input-panel">

      <h2>Assembly Input</h2>

      <label>Facade ID</label>

      <select id="elementId">

      </select>

      <label>Element</label>

<select id="subElementId">

</select>

      <label>Operation</label>

      <select id="stage">

        <option>Frame assembly</option>
        <option>EPDM</option>
        <option>Hardware</option>
        <option>Sealant</option>
        <option>Glass installation</option>
        <option>QC</option>
        <option>Packing</option>

      </select>

      <label>Employee</label>

<select id="employee">

</select>

      <label>Note</label>

      <textarea
        id="note"
        placeholder="Additional comments..."
      ></textarea>

      <label>Photo 1</label>

      <input
        type="file"
        id="photo1"
        accept="image/*"
      />

      <label>Photo 2</label>

      <input
        type="file"
        id="photo2"
        accept="image/*"
      />

      <label>Photo 3</label>

      <input
        type="file"
        id="photo3"
        accept="image/*"
      />

      <button
        class="submit-btn"
        onclick="saveData()"
      >
        Submit
      </button>

      <div
        class="success-message"
        id="success"
      ></div>

    </section>

    <!-- RIGHT PANEL -->

    <section class="viewer-panel">

      <div class="viewer-header">

        <h2>Assembly Viewer</h2>

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Search facade"
          />

          <button onclick="searchData()">
            Search
          </button>

        </div>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>Facade</th>
              <th>Element</th>
              <th>Operation</th>
              <th>Employee</th>
              <th>Note</th>
              <th>Photos</th>
              <th>Time</th>

            </tr>

          </thead>

          <tbody id="viewerTable">

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer class="footer">

    <div>
      Version 1.0
    </div>

    <div>
      Firebase Connected
    </div>

  </footer>
  
  <script type="module" src="js/firebase_check_current_project.js"></script>
  
  <script
    type="module"
    src="js/app.js"
  ></script>

  <script
    type="module"
    src="js/viewer.js"
  ></script>

</body>

</html>
