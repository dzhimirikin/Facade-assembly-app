<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facade Assembly</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <div class="container">

    <div class="nav">

      <a href="index.html">Assembly</a>
      <a href="viewer.html">Viewer</a>

    </div>

    <h1>Facade Assembly</h1>

    <form id="assemblyForm">

      <label>Element ID</label>

      <input
        type="text"
        id="elementId"
        placeholder="EF-001"
        required
      >

      <label>Stage</label>

      <select id="stage">

        <option>Frame assembly</option>
        <option>EPDM</option>
        <option>Hardware</option>
        <option>Sealant</option>
        <option>QC</option>
        <option>Packing</option>

      </select>

      <label>Employee</label>

      <input
        type="text"
        id="employee"
        placeholder="Name"
        required
      >

      <label>Photo</label>

      <input
        type="file"
        id="photo"
      >

      <button type="submit">
        Submit
      </button>

    </form>

    <div class="success" id="success"></div>

  </div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
