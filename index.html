<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facade Control System</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

  <div class="topbar">

    <div class="logo">
      Facade Control System
    </div>

    <div class="tabs">

      <button class="tab active"
              onclick="showTab('assembly')">
        Assembly
      </button>

      <button class="tab"
              onclick="showTab('viewer')">
        Viewer
      </button>

      <button class="tab admin-only"
              id="adminTab"
              onclick="showTab('admin')"
              style="display:none;">
        Admin 🔒
      </button>

    </div>

  </div>

  <!-- ASSEMBLY -->

  <div class="content tab-content active"
       id="assembly">

    <div class="card">

      <h2>Assembly Input</h2>

      <form id="assemblyForm">

        <label>Element ID</label>

        <input
          type="text"
          id="elementId"
          placeholder="EF-001"
          required
        >

        <label>Stage</label>

        <select id="stage">

          <option>Frame assembly</option>
          <option>EPDM</option>
          <option>Hardware</option>
          <option>Sealant</option>
          <option>QC</option>
          <option>Packing</option>

        </select>

        <label>Employee</label>

        <input
          type="text"
          id="employee"
          placeholder="Name"
          required
        >

        <label>Photo</label>

        <input
          type="file"
          id="photo"
        >

        <button type="submit">
          Submit
        </button>

      </form>

      <div class="success"
           id="success">
      </div>

    </div>

  </div>

  <!-- VIEWER -->

  <div class="content tab-content"
       id="viewer">

    <div class="card">

      <h2>Assembly Viewer</h2>

      <input
        type="text"
        id="searchId"
        placeholder="Enter Element ID"
      >

      <button onclick="loadData()">
        Search
      </button>

      <table>

        <thead>

          <tr>
            <th>Element</th>
            <th>Stage</th>
            <th>Employee</th>
            <th>Time</th>
          </tr>

        </thead>

        <tbody id="results">
        </tbody>

      </table>

    </div>

  </div>

  <!-- ADMIN -->

  <div class="content tab-content"
       id="admin">

    <div class="card">

      <h2>Admin Panel 🔒</h2>

      <div class="admin-grid">

        <button>
          Manage Users
        </button>

        <button>
          Export PDF
        </button>

        <button>
          Statistics
        </button>

        <button>
          System Settings
        </button>

      </div>

    </div>

  </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
