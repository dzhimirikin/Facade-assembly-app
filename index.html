<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Facade Control System</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- TOP BAR -->

  <header class="topbar">

    <div class="logo">
      Facade Control System
    </div>

    <nav class="menu">

      <button class="menu-btn active">
        Assembly
      </button>

      <a href="viewer.html" class="menu-btn">
        Viewer
      </a>

      <button class="menu-btn">
        Admin
      </button>

    </nav>

    <div class="user-panel">
      Worker
    </div>

  </header>

  <!-- MAIN -->

  <main class="main-layout">

    <!-- LEFT -->

    <section class="card form-card">

      <h2>Assembly Input</h2>

      <label>Element ID</label>

      <input
        type="text"
        id="elementId"
        placeholder="EF-001"
      />

      <label>Stage</label>

      <select id="stage">

        <option>Frame assembly</option>
        <option>EPDM</option>
        <option>Hardware</option>
        <option>Sealant</option>
        <option>QC</option>
        <option>Packing</option>

      </select>

      <label>Employee</label>

      <input
        type="text"
        id="employee"
        placeholder="Ivan Petrov"
      />

      <label>Photo</label>

      <input
        type="file"
        id="photo"
        accept="image/*"
      />

      <img
        id="preview"
        class="preview-image"
      />

      <button
        class="submit-btn"
        onclick="saveData()"
      >
        Submit
      </button>

      <div
        class="success-box"
        id="success"
      >
      </div>

    </section>

    <!-- RIGHT -->

    <section class="card viewer-card">

      <div class="viewer-header">

        <h2>Assembly Viewer</h2>

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Enter Element ID"
          />

          <button onclick="searchElement()">
            Search
          </button>

        </div>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>Element ID</th>
              <th>Stage</th>
              <th>Employee</th>
              <th>Time</th>
            </tr>

          </thead>

          <tbody id="viewerTable">

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer class="footer">

    <div>
      Version 1.0
    </div>

    <div>
      Firebase Connected
    </div>

  </footer>

  <script type="module" src="js/app.js"></script>

</body>
</html>
