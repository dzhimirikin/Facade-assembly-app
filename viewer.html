<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Assembly Viewer</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

</head>

<body>

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="logo">
      Facade Control System
    </div>

    <nav class="menu">

      <a
        href="index.html"
        class="menu-btn"
      >
        Assembly
      </a>

      <button class="menu-btn active">
        Viewer
      </button>

      <button class="menu-btn">
        Admin
      </button>

    </nav>

    <div class="user-panel">
      Worker
    </div>

  </header>

  <!-- MAIN -->

  <main class="viewer-page">

    <section class="card viewer-full">

      <div class="viewer-header">

        <h2>Assembly Viewer</h2>

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Enter Element ID"
          />

          <button onclick="searchElement()">
            Search
          </button>

        </div>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>Element ID</th>
              <th>Stage</th>
              <th>Employee</th>
              <th>Time</th>

            </tr>

          </thead>

          <tbody id="viewerTable">

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer class="footer">

    <div>
      Version 1.0
    </div>

    <div>
      Firebase Connected
    </div>

  </footer>

  <script
    type="module"
    src="js/viewer.js"
  ></script>

</body>

</html>
