<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facade Viewer</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <div class="nav">

    id="searchId"
