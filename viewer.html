<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Assembly Viewer
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <link
    rel="stylesheet"
    href="css/viewer.css"
  />

</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <div class="logo">
      Facade Control System
    </div>

    <nav class="topnav">

      <button
        onclick="location.href='index.html'"
      >
        Assembly
      </button>

      <button class="active">
        Viewer
      </button>

      <button
        onclick="location.href='admin.html'"
      >
        Admin
      </button>

    </nav>

    <div class="user-role">
      QC / Engineering
    </div>

  </header>

  <!-- MAIN -->

  <main class="viewer-only-layout">

    <section class="viewer-panel full-view">

      <div class="viewer-header">

        <h2>
          Assembly Tracking
        </h2>

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Search facade / element"
          />

          <button onclick="searchData()">
            Filter
          </button>

        </div>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>Facade</th>
              <th>Element</th>
              <th>Operation</th>
              <th>Employee</th>
              <th>Note</th>
              <th>Photos</th>
              <th>Time</th>

            </tr>

          </thead>

          <tbody id="viewerTable">

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer class="footer">

    <div>
      Viewer Mode
    </div>

    <div>
      Firebase Connected
    </div>

  </footer>

  <!-- JS -->

  <script
    type="module"
    src="js/viewer.js"
  ></script>

</body>

</html>
